name: restaurant-pos

services:
  postgres:
    image: postgres:16-alpine
    container_name: restaurant-pos-postgres
    restart: unless-stopped
    profiles:
      - dev
      - prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-restaurant_pos_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-restaurant_pos_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - restaurant-pos-network

  redis:
    image: redis:7-alpine
    container_name: restaurant-pos-redis
    restart: unless-stopped
    profiles:
      - dev
      - prod
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - restaurant-pos-network

volumes:
  postgres_data:
    name: restaurant_pos_postgres_data
  redis_data:
    name: restaurant_pos_redis_data

networks:
  restaurant-pos-network:
    name: restaurant-pos-network

